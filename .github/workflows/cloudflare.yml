name: Deploy to Cloudflare Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    name: Deploy to Cloudflare Pages
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm ci
      - name: Build Next.js
        run: npm run build
        env:
          NEXT_PUBLIC_CLOUD_FLARE_ID: ${{ secrets.CLOUD_FLARE_ID }}
          NEXT_PUBLIC_CLOUD_FLARE_API: ${{ secrets.CLOUD_FLARE_API }}
      - name: Publish to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUD_FLARE_API }}
          accountId: ${{ secrets.CLOUD_FLARE_ID }}
          projectName: fashion-design-architecture
          directory: out
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
